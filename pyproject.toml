[project]
name = "medical-questions-answering"
version = "0.1.0"
description = ""
authors = [{ name = "hxastur", email = "arz.mikhail@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12.9,<4.0"
dependencies = [
    "python-dotenv>=1.1.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[dependency-groups]
api = [
    "clearml>=2.1.3,<3.0.0",
    "torch>=2.7.1,<3.0.0",
    "datasets>=3.6.0,<4.0.0",
    "transformers>=4.52.4,<5.0.0",
    "fastapi>=0.115.12,<0.116.0",
    "uvicorn[standard]>=0.34.3,<0.35.0",
    "sentence-transformers>=4.1.0,<5.0.0",
    "faiss-cpu>=1.11.0,<2.0.0",
    "accelerate>=0.26.0",
    "langchain>=0.3.25,<0.4.0",
    "langchain-community>=0.3.24,<0.4.0",
    "langchain-openai>=0.3.21,<0.4.0",
    "langgraph>=0.2.0",
    "rouge-score>=0.1.2",
    "peft>=0.13.0",
    "bitsandbytes>=0.44.0",
    "trl>=0.12.0",
    "nltk>=3.9",
]
bot = [
    "aiogram>=3.20.0.post0,<4.0.0",
    "httpx>=0.27.0",
]
dev = [
    "black>=26.1.0,<27.0.0",
    "ipykernel>=6.29.5,<7.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
